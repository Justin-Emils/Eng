<style>
  :root{
    --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
    --sans: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0a09;font-family:var(--sans);color:#e8e0d2;padding:26px 30px 30px;width:1520px}
  .page-head{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
  .page-head h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:.5px}
  .page-head .rule{flex:1;height:1px;background:linear-gradient(90deg,#8a7440,transparent)}
  .page-head .sub{font-size:10.5px;letter-spacing:2.2px;color:#9a8a6c;text-transform:uppercase}
  .row{display:flex;gap:20px;align-items:flex-start}

  /* ---------- 手机外框 ---------- */
  .phone{
    width:330px;height:796px;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;
    border:1px solid rgba(190,160,90,.35);box-shadow:0 18px 40px rgba(0,0,0,.55);
  }
  .phone .screen{
    flex:1;background:var(--bg);color:var(--text);display:flex;flex-direction:column;
    overflow:hidden;background-image:var(--glow);background-repeat:no-repeat;
  }
  /* 默认主题 */
  .phone.d.light{--bg:#fff;--surface:#F0F0F3;--sel:#E0E1E6;--text:#000;--dim:#60646C;
    --accent:#208AEF;--accentStr:#0F5CC0;--onAccent:#fff;--accentSoft:#E3F2FD;
    --annotate:#1068CC;--annotateStr:#0B4E9B;--gold:#B9C0CA;--border:#D5D9DF;--glow:transparent}
  /* 叙拉古 */
  .phone.s.light{--bg:#F5EFE2;--surface:#FFFCF4;--sel:#EADFC8;--text:#1A1512;--dim:#6B5A47;
    --accent:#7C1B2B;--accentStr:#6B1220;--onAccent:#F7EEDD;--accentSoft:#F2DED9;
    --annotate:#7C1B2B;--annotateStr:#5E101F;--gold:#A8823C;--border:#D8C6A6;--glow:transparent}
  .phone.s.dark{--bg:#131010;--surface:#201A17;--sel:#2E2521;--text:#F3EADB;--dim:#BAA98F;
    --accent:#E4B45A;--accentStr:#E4B45A;--onAccent:#2A1E09;--accentSoft:#3A2E18;
    --annotate:#E4B45A;--annotateStr:#F2CE84;--gold:#C9A75A;--border:#3B3028;
    --glow:radial-gradient(120% 40% at 50% -6%, rgba(228,180,90,.20), rgba(228,180,90,0) 70%)}
  .phone.s.light .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background-image:repeating-linear-gradient(0deg, rgba(120,95,55,.05) 0 1px, transparent 1px 3px)}

  .status{height:26px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 16px 5px;font-size:9.5px;letter-spacing:.6px;color:var(--dim)}
  .topbar{display:flex;align-items:center;gap:10px;padding:5px 16px 11px;
    border-bottom:1px solid var(--border);position:relative;z-index:2}
  .topbar .back{font-family:var(--serif);font-size:25px;line-height:1;color:var(--accent);margin-top:-4px}
  .topbar .t{flex:1;font-size:12.5px;font-weight:700;letter-spacing:.5px}
  .topbar .r{width:22px}

  .body{flex:1;padding:12px 16px 0;display:flex;flex-direction:column;gap:11px;position:relative;z-index:2}
  .sect{font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--dim);margin-left:3px}
  .list{border:1px solid var(--border);border-radius:4px;background:var(--surface);padding:0 13px}
  .rowx{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:11px 0;min-height:46px;border-bottom:1px solid var(--border)}
  .rowx.last{border-bottom:0}
  .rowx .lb{flex:1}
  .rowx .lb .t{font-size:12.5px;font-weight:500}
  .rowx .lb .s{font-size:10px;line-height:1.5;color:var(--dim);margin-top:2px}
  .rowx .v{font-size:10.5px;color:var(--dim);white-space:nowrap}

  .chips{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:12px}
  .chip{font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
    color:var(--dim);background:var(--bg)}
  .chip.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accent);font-weight:600}

  /* 主题预览卡 */
  .grid{display:flex;gap:12px;padding-bottom:12px}
  .tp{flex:1;display:flex;flex-direction:column;gap:6px}
  .tp .frame{border-radius:6px;padding:7px;display:flex;flex-direction:column;gap:6px}
  .tp .mini{border-radius:4px;padding:7px;display:flex;flex-direction:column;gap:4px}
  .tp .mcard{border-radius:3px;padding:7px;display:flex;flex-direction:column;gap:5px}
  .tp .mtitle{height:5px;width:62%;border-radius:2px}
  .tp .mline{height:3px;width:88%;border-radius:2px}
  .tp .mrow{display:flex;align-items:center;gap:5px;margin-top:1px}
  .tp .mdot{width:9px;height:9px;border-radius:999px}
  .tp .mbar{height:3px;flex:1;border-radius:2px}
  .tp .mgold{height:2px;border-radius:1px}
  .tp .sw{display:flex;gap:3px}
  .tp .sw i{flex:1;height:12px;border-radius:2px;display:block}
  .tp .nm{font-size:11.5px;font-weight:700}
  .tp .tg{font-size:10px;line-height:1.45;color:var(--dim)}

  .note{font-size:10.5px;line-height:1.55;color:var(--accent);padding-bottom:10px}
  figcaption{margin-top:11px;font-size:9.5px;letter-spacing:1.8px;color:#9a8a6c;text-align:center;text-transform:uppercase}
</style>
</head>
